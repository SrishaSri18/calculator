<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 320px;
            padding: 20px;
            border-radius: 20px;
            background: #20212b;
            box-shadow: 0 15px 35px #0004;
        }

        h2 {
            color: white;
            text-align: center;
            margin-top: 0;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f5f5f5;
            color: #222;
            text-align: right;
            font-size: 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            background: #353644;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #505164;
        }

        .operator {
            background: #7657e8;
        }

        .operator:hover {
            background: #9278f3;
        }

        .clear {
            background: #e74c3c;
        }

        .equal {
            background: #20a879;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Calculator</h2>

        <input type="text" id="display"
               value="0" readonly aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let waitingForSecond = false;

        function appendNumber(number) {
            if (display.value === "Error") {
                clearDisplay();
            }

            if (waitingForSecond) {
                display.value = number === "." ? "0." : number;
                waitingForSecond = false;
                return;
            }

            if (number === "." && display.value.includes(".")) {
                return;
            }

            if (display.value === "0" && number !== ".") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function chooseOperator(nextOperator) {
            if (display.value === "Error") return;

            if (operator && !waitingForSecond) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = nextOperator;
            waitingForSecond = true;
        }

        function calculate() {
            if (operator === null || waitingForSecond) return;

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;
                case "-":
                    result = firstNumber - secondNumber;
                    break;
                case "*":
                    result = firstNumber * secondNumber;
                    break;
                case "/":
                    result = secondNumber === 0
                        ? "Error"
                        : firstNumber / secondNumber;
                    break;
                case "%":
                    result = firstNumber % secondNumber;
                    break;
            }

            if (typeof result === "number") {
                result = Number(result.toPrecision(12));
            }

            display.value = String(result);
            firstNumber = null;
            operator = null;
            waitingForSecond = true;
        }

        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            waitingForSecond = false;
        }

        function deleteLast() {
            if (display.value === "Error" || waitingForSecond) {
                clearDisplay();
                return;
            }

            display.value = display.value.length > 1
                ? display.value.slice(0, -1)
                : "0";
        }
    </script>
</body>
</html>
